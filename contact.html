<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Just Jap Imports</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <!-- Shared site navigation -->
    <nav class="navbar">
        <div class="container nav-wrap">
            <div class="logo"><i class="bi bi-car-front-fill"></i>Just Jap Imports</div>

            <input class="nav-toggle-input" type="checkbox" id="nav-toggle-contact">
            <label class="nav-toggle" for="nav-toggle-contact" aria-label="Toggle navigation">
                <i class="bi bi-list"></i>
            </label>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contact page header -->
    <header class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Reach out for pricing, test drives, or personalized vehicle assistance.</p>
        </div>
    </header>

    <!-- Contact page content -->
    <main class="contact-page">
        <div class="container contact-content">
            <!-- Contact enquiry form -->
            <form class="contact-form" action="mailto:sales@justjapimports.com" method="post" enctype="text/plain">
                <input type="text" name="name" placeholder="Your Name" minlength="2" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" rows="5" minlength="10" required></textarea>
                <button type="submit" class="submit-btn" onclick="return confirm('Your message has been sent, we will get back to you soon!');">Send Message</button>
            </form>

            <!-- Dealership contact information -->
            <div class="contact-info">
                <div class="info-item location-card">
                    <h4>Phone</h4>
                    <p class="phone-number">+44 7832977364</p>
                </div>

                <div class="info-item">
                    <h4>Email</h4>
                    <p>sales@justjapimports.com</p>
                </div>

                <div class="info-item">
                    <h4>Address</h4>
                    <p class="location-details">123 Luxury Lane<br>Premium City, CV6 6XY</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Shared site footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Just Jap Imports. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="Facebook" title="Facebook"><i class="bi bi-facebook" aria-hidden="true"></i></a>
                <a href="#" aria-label="Instagram" title="Instagram"><i class="bi bi-instagram" aria-hidden="true"></i></a>
                <a href="#" aria-label="Twitter" title="Twitter"><i class="bi bi-twitter" aria-hidden="true"></i></a>
            </div>
        </div>
    </footer>

</body>
</html>
